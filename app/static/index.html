<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dock-to-Door</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0e1117;--panel:#151a23;--card:#1c2330;--line:#2a3344;--tx:#e6e9ef;--mut:#8a94a7;--ok:#3ddc97;--warn:#ffb020;--bad:#ff5c5c;--acc:#4c9aff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
header h1{font-size:15px;margin:0}header .sp{flex:1}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;background:var(--card);border:1px solid var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
main{flex:1;display:grid;grid-template-columns:340px 1fr 440px;min-height:0}
aside{background:var(--panel);overflow:auto;padding:10px;border-right:1px solid var(--line)}
aside#right{border-right:0;border-left:1px solid var(--line)}
#map{height:100%;background:#222}
h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
input,select,textarea,button{background:#0e1117;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;width:100%}
textarea{height:80px;resize:vertical}button{cursor:pointer;width:auto}button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.row>*{flex:1}
.chips button{font-size:11px;padding:3px 7px}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.kv div:nth-child(odd){color:var(--mut)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:10px}
.tl .e{margin:0 0 7px;position:relative}.tl .e:before{content:"";position:absolute;left:-15px;top:6px;width:8px;height:8px;border-radius:4px;background:var(--acc)}
.tl .e.r:before{background:var(--ok)}.tl .e.t:before{background:var(--warn)}.tl .e.x:before{background:var(--bad)}
.who{font-size:10px;color:var(--mut);text-transform:uppercase}
details summary{cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;margin:4px 0;font-size:11px;color:#b9c3d6;max-height:180px;overflow:auto}
img.th{max-height:90px;border-radius:6px;margin-top:4px}
.fleet div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
</style></head><body>
<header><h1>📦➡️🚪 Dock-to-Door <span class="mut">autonomous exception handling</span></h1><span class="sp"></span>
<span class="badge" id="hAdk"></span><span class="badge" id="hMaps"></span>
<button onclick="resetAll()">Reset demo</button></header>
<main>
<aside id="left">
  <h3>Report an incident (driver app)</h3>
  <div class="card">
    <select id="veh" onchange="loadSpark()"></select>
    <div class="chips row" id="presets"></div>
    <textarea id="txt" placeholder="Driver message / transcript"></textarea>
    <div class="row"><input type="file" id="img" accept="image/*" onchange="prevImg()"></div>
    <img id="imgPrev" class="th" style="display:none">
    <div class="row"><button id="recBtn" onclick="toggleRec()">🎙 Record voice note</button><span id="recInfo" class="mut" style="align-self:center"></span></div>
    <div class="row"><select id="mode"><option value="auto">Mode: auto (ADK if key set)</option><option value="offline">Mode: offline rules</option><option value="adk">Mode: force ADK</option></select>
    <button class="pri" onclick="submitIncident()">Send to agent</button></div>
  </div>
  <h3>Reefer temperature (°C)</h3><div class="card"><svg id="spark" width="100%" height="70" viewBox="0 0 300 70" preserveAspectRatio="none"></svg><div id="sparkInfo" class="mut"></div></div>
  <h3>Fleet</h3><div class="card fleet" id="fleet"></div>
</aside>
<div id="map"></div>
<aside id="right">
  <h3>Incidents</h3><div id="incList" class="row chips"></div>
  <div id="incident"></div>
  <h3>Feedback loop</h3><div id="learning"></div>
  <h3>Outbound messages (simulated)</h3><div id="notes"></div>
</aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o)=>{const r=await fetch(p,o);return r.json()};
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
let S=null,cur=null,D=null,audioBlob=null,sigs={},ovr={open:false,did:null,cands:[]};
const PRESETS={
 'Reefer failing + crushed pallets':['TRK-3',"Reefer unit has stopped cooling and the temperature display keeps climbing. Two pallets also got crushed when I braked hard. Truck is still drivable."],
 'Engine seized':['TRK-5',"Engine seized near the toll plaza, truck won't start. Stuck on the highway."],
 'Road flooded':['TRK-2',"Road ahead is flooded and police have blocked the highway, long jam."],
 'Vague report':['TRK-1',"something is wrong with the truck, not sure what"]};
$('presets').innerHTML=Object.keys(PRESETS).map(k=>`<button onclick="preset('${k}')">${k}</button>`).join('');
function preset(k){const[v,t]=PRESETS[k];$('veh').value=v;$('txt').value=t;loadSpark()}

const map=L.map('map').setView([12.95,78.4],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);let fitted=false;
const COL={in_transit:'#4c9aff',available:'#3ddc97',out_of_service:'#ff5c5c',dispatched:'#ffb020'};

function drawMap(){
 const sig=JSON.stringify([S.vehicles.map(v=>v.status),S.decisions.slice(0,6).map(d=>[d.id,d.status])]);
 if(sigs.map===sig)return;sigs.map=sig;layer.clearLayers();
 S.depots.forEach(d=>L.circleMarker([d.lat,d.lon],{radius:5,color:'#8a94a7',fillOpacity:.6}).bindTooltip(d.name).addTo(layer));
 S.shipments.filter(s=>['in_transit','recovering'].includes(s.status)).forEach(s=>L.circleMarker([s.dest_lat,s.dest_lon],{radius:4,color:'#c792ea'}).bindTooltip('Dest: '+s.dest_name).addTo(layer));
 S.vehicles.forEach(v=>L.circleMarker([v.lat,v.lon],{radius:9,color:COL[v.status]||'#fff',fillOpacity:.85}).bindTooltip(`${v.id} · ${v.driver} · ${v.temp_class} · ${v.status}`).addTo(layer));
 S.decisions.slice(0,3).filter(d=>['executed','pending_approval'].includes(d.status)&&d.route).forEach(d=>{
   const r=JSON.parse(d.route),pend=d.status==='pending_approval';
   if(r[0])L.polyline(r[0],{color:'#ffb020',weight:4,dashArray:'8 6',opacity:pend?.5:1}).addTo(layer);
   if(r[1])L.polyline(r[1],{color:'#3ddc97',weight:4,opacity:pend?.5:1}).addTo(layer);
   if(d.meet_lat)L.circleMarker([d.meet_lat,d.meet_lon],{radius:7,color:'#fff',fillColor:'#ffb020',fillOpacity:1}).bindTooltip('Transfer: '+d.meet_label).addTo(layer)});
 if(!fitted){map.fitBounds(L.latLngBounds(S.depots.map(d=>[d.lat,d.lon])).pad(.1));fitted=true}
}
function drawFleet(){
 const sig=JSON.stringify(S.vehicles.map(v=>v.status));if(sigs.fleet===sig)return;sigs.fleet=sig;
 $('fleet').innerHTML=S.vehicles.map(v=>`<div><span>${v.id} <span class="mut">${v.driver} · ${v.temp_class}</span></span><span style="color:${COL[v.status]}">${v.status}</span></div>`).join('');
 const sel=$('veh'),old=sel.value;
 sel.innerHTML=S.vehicles.filter(v=>S.shipments.some(s=>s.vehicle_id===v.id)).map(v=>`<option value="${v.id}">${v.id} — ${esc(S.shipments.find(s=>s.vehicle_id===v.id).cargo)}</option>`).join('');
 if(old)sel.value=old;if(!sigs.sparkInit){sigs.sparkInit=1;loadSpark()}
}
async function loadSpark(){
 const rows=await api('/api/telemetry/'+$('veh').value),sv=$('spark');
 const t=rows.map(r=>r.temp_c);if(!t.length)return;
 const mn=Math.min(...t,0),mx=Math.max(...t,9),y=v=>66-(v-mn)/(mx-mn)*60;
 const isCold=t[t.length-1]<20;
 sv.innerHTML=isCold?`<line x1="0" x2="300" y1="${y(8)}" y2="${y(8)}" stroke="#ff5c5c" stroke-dasharray="4"/><polyline fill="none" stroke="#4c9aff" stroke-width="2" points="${t.map((v,i)=>`${i/(t.length-1)*300},${y(v)}`).join(' ')}"/>`:'';
 $('sparkInfo').textContent=isCold?`latest ${t[t.length-1].toFixed(1)}°C · limit 8°C (red)`:'ambient cargo — no cold-chain telemetry';
}
function prevImg(){const f=$('img').files[0];const p=$('imgPrev');if(f){p.src=URL.createObjectURL(f);p.style.display='block'}else p.style.display='none'}

let rec=null,chunks=[];
async function toggleRec(){
 if(rec){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(st);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());rec=null;$('recBtn').textContent='🎙 Record voice note';
    audioBlob=await toWav(new Blob(chunks));$('recInfo').textContent=`✓ voice note ${(audioBlob.size/32000).toFixed(1)}s`};
  rec.start();$('recBtn').textContent='⏹ Stop'}catch(e){alert('Mic unavailable: '+e.message)}
}
async function toWav(blob){
 const ctx=new (window.AudioContext||window.webkitAudioContext)();const a=await ctx.decodeAudioData(await blob.arrayBuffer());
 const off=new OfflineAudioContext(1,Math.ceil(a.duration*16000),16000);const s=off.createBufferSource();s.buffer=a;s.connect(off.destination);s.start();
 const pcm=(await off.startRendering()).getChannelData(0),o=new DataView(new ArrayBuffer(44+pcm.length*2));
 const w=(p,t)=>[...t].forEach((c,i)=>o.setUint8(p+i,c.charCodeAt(0)));
 w(0,'RIFF');o.setUint32(4,36+pcm.length*2,true);w(8,'WAVEfmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);
 o.setUint32(24,16000,true);o.setUint32(28,32000,true);o.setUint16(32,2,true);o.setUint16(34,16,true);w(36,'data');o.setUint32(40,pcm.length*2,true);
 for(let i=0;i<pcm.length;i++){const v=Math.max(-1,Math.min(1,pcm[i]));o.setInt16(44+i*2,v<0?v*0x8000:v*0x7fff,true)}
 return new Blob([o],{type:'audio/wav'});
}
async function submitIncident(){
 const fd=new FormData();fd.append('vehicle_id',$('veh').value);fd.append('text',$('txt').value);fd.append('mode',$('mode').value);
 const f=$('img').files[0];if(f)fd.append('image',f);if(audioBlob)fd.append('audio',audioBlob,'note.wav');
 const j=await (await fetch('/api/incidents',{method:'POST',body:fd})).json();
 cur=j.id;audioBlob=null;$('recInfo').textContent='';$('txt').value='';$('img').value='';prevImg();sigs.inc='';refresh();
}

const stCls=s=>({executed:'ok',actioned:'ok',pending_approval:'warn',awaiting_approval:'warn',running:'warn',overridden:'bad',needs_human:'bad',rejected:'bad',failed:'bad'}[s]||'');
function drawIncidents(){
 $('incList').innerHTML=S.incidents.map(i=>`<button onclick="cur=${i.id};sigs.inc='';refresh()" style="${i.id===cur?'border-color:var(--acc)':''}">#${i.id} ${i.vehicle_id} <span class="${stCls(i.status)}">${i.status}</span></button>`).join('')||'<span class="mut">none yet — send one from the left</span>';
}
function tlEntry(e){
 const cls=e.kind==='tool_call'?'t':e.kind==='tool_result'?'r':e.name==='adk_error'||e.name==='error'?'x':'';
 const body=e.kind==='text'&&typeof e.data==='string'?`<div>${esc(e.data)}</div>`:`<details><summary>${e.kind==='tool_call'?'→':'←'} <b>${esc(e.name)}</b> ${e.kind==='tool_call'?esc(JSON.stringify(e.data)).slice(0,90):''}</summary><pre>${esc(JSON.stringify(e.data,null,1))}</pre></details>`;
 return `<div class="e ${cls}"><div class="who">${esc(e.author)} · ${e.kind==='text'?esc(e.name):e.kind.replace('_',' ')}</div>${body}</div>`;
}
function decisionCard(d){
 const st=stCls(d.status);
 const btns=[];
 if(d.status==='pending_approval')btns.push(`<button class="pri" onclick="act('approve',${d.id})">✅ Approve</button>`);
 if(['pending_approval','executed'].includes(d.status))btns.push(`<button onclick="openOverride(${d.id})">↪ Override</button>`);
 if(d.status==='executed'&&d.actual_min==null)btns.push(`<button onclick="act('simulate-outcome',${d.id})">⏩ Simulate outcome</button>`);
 btns.push(`<button onclick="rate(${d.id},1)" style="${d.rating===1?'border-color:var(--ok)':''}">👍</button><button onclick="rate(${d.id},-1)" style="${d.rating===-1?'border-color:var(--bad)':''}">👎</button>`);
 return `<div class="card"><div><b>${d.mode==='detour'?'Detour':'Swap → '+esc(d.vehicle_id)}</b> <span class="pill ${st}">${d.status}</span>${d.override_of?` <span class="mut">(human override of ${esc(d.override_of)})</span>`:''}</div>
 <div class="kv" style="margin-top:6px"><div>Meet point</div><div>${esc(d.meet_label)}</div><div>Predicted</div><div>${d.predicted_min} min → ETA ${esc(d.eta_local)}</div>
 <div>SLA left</div><div class="${d.sla_ok?'ok':'bad'}">${d.sla_remaining_min} min ${d.sla_ok?'✔ on track':'✖ at risk'}</div><div>Cold chain</div><div class="${d.cold_ok?'ok':'bad'}">${d.cold_ok?'✔ protected':'✖ breach before transfer'}</div>
 <div>Cost</div><div>₹${Math.round(d.cost_inr)}</div><div>Confidence</div><div>${(d.confidence||0).toFixed(2)}</div>
 ${d.actual_min!=null?`<div>Actual</div><div class="${d.sla_held?'ok':'bad'}">${d.actual_min} min (${d.sla_held?'SLA held':'SLA missed'})</div>`:''}</div>
 ${d.escalation?`<div class="warn" style="margin-top:6px">⚠ Escalated: ${esc(d.escalation)}</div>`:''}
 <div class="mut" style="margin-top:6px">${esc(d.reasoning)}</div><div class="row">${btns.join('')}</div></div>`;
}
function drawIncident(){
 if(!D){$('incident').innerHTML='';return}
 const sig=JSON.stringify([D,ovr]);if(sigs.inc===sig)return;sigs.inc=sig;
 const t=D.triage;
 let h=`<div class="card"><b>#${D.id}</b> ${esc(D.vehicle_id)} <span class="pill ${stCls(D.status)}">${D.status}</span> <span class="badge">${esc(D.mode)}</span>
  <div class="mut">${esc(D.text)}</div>${D.image_path?`<img class="th" src="/uploads/${D.image_path}">`:''}${D.audio_path?`<audio controls src="/uploads/${D.audio_path}" style="width:100%;margin-top:4px"></audio>`:''}</div>`;
 if(t)h+=`<div class="card"><b>Triage</b> <span class="pill">${esc(t.incident_type)}</span> <span class="pill">${esc(t.severity)}</span> <span class="pill">conf ${(+t.confidence).toFixed(2)}</span>
  <div class="mut" style="margin-top:4px">${esc(t.summary)}</div><div class="kv" style="margin-top:4px"><div>Damage</div><div>${esc(t.damage_assessment)}</div><div>Pallets hit</div><div>${t.pallets_affected}</div><div>Drivable</div><div>${t.vehicle_drivable}</div>${t.transcript&&t.transcript!==D.text?`<div>Transcript</div><div>${esc(t.transcript)}</div>`:''}</div></div>`;
 h+=D.decisions.map(decisionCard).join('');
 if(ovr.open&&D.decisions.some(d=>d.id===ovr.did))h+=`<div class="card"><b>Override: choose vehicle</b><select id="ovV">${ovr.cands.map(c=>`<option value="${c.vehicle_id}">${c.vehicle_id} — ${c.predicted_min} min, ₹${c.cost_inr}, ${c.cold_ok?'cold ✔':'cold ✖'}</option>`).join('')}</select>
  <input id="ovR" placeholder="Reason (becomes a labelled training example)" style="margin-top:6px"><div class="row"><button class="pri" onclick="doOverride()">Apply override</button><button onclick="ovr.open=false;sigs.inc=''">Cancel</button></div></div>`;
 if(D.summary)h+=`<div class="card"><b>Audit summary</b><div class="mut">${esc(D.summary)}</div></div>`;
 h+=`<h3>Agent timeline</h3><div class="tl">${D.trace.map(tlEntry).join('')||'<span class="mut">waiting…</span>'}</div>`;
 $('incident').innerHTML=h;
}
function drawLearning(){
 const s=S.stats,sig=JSON.stringify([s,S.rules]);if(sigs.learn===sig)return;sigs.learn=sig;
 $('learning').innerHTML=`<div class="card"><div class="kv"><div>Resolved cases</div><div>${s.resolved}</div><div>Avg ETA error</div><div>${s.mape_pct==null?'–':s.mape_pct+'%'}</div><div>SLA held</div><div>${s.sla_held_pct==null?'–':s.sla_held_pct+'%'}</div><div>Human overrides</div><div>${s.overrides}</div></div>
 ${S.rules.map(r=>`<div class="ok" style="margin-top:6px">📘 ${esc(r.text)}</div>`).join('')}
 <div class="row"><button onclick="learnNow()">🧠 Run learning job</button></div><div class="mut">Resolve ≥2 incidents of a type (“Simulate outcome”), then run learning. The next plan of that type gets an ETA buffer.</div></div>`;
}
function drawNotes(){
 $('notes').innerHTML=S.notifications.map(n=>`<div class="card"><span class="pill">${esc(n.party)}</span> <span class="mut">#${n.incident_id} · ${esc(n.channel)}</span><div>${esc(n.message)}</div></div>`).join('')||'<span class="mut">none</span>';
}
async function act(a,id){await post(`/api/decisions/${id}/${a}`);sigs.inc='';refresh()}
async function rate(id,v){await post(`/api/decisions/${id}/rate`,{rating:v});sigs.inc='';refresh()}
async function openOverride(id){const r=await api(`/api/decisions/${id}/candidates`);ovr={open:true,did:id,cands:r.candidates||[]};sigs.inc='';drawIncident()}
async function doOverride(){const r=await post(`/api/decisions/${ovr.did}/override`,{vehicle_id:$('ovV').value,reason:$('ovR').value});if(r.error)alert(r.error);ovr={open:false,did:null,cands:[]};sigs.inc='';refresh()}
async function learnNow(){await post('/api/learn');sigs.learn='';refresh()}
async function resetAll(){if(!confirm('Reset fleet and all history?'))return;await post('/api/reset');cur=null;D=null;sigs={};fitted=false;refresh()}

async function refresh(){
 try{S=await api('/api/state');if(cur==null&&S.incidents.length)cur=S.incidents[0].id;
  D=cur!=null?await api('/api/incidents/'+cur):null;if(D&&D.detail)D=null;
  drawMap();drawFleet();drawIncidents();drawIncident();drawLearning();drawNotes()}catch(e){console.error(e)}
}
api('/api/health').then(h=>{$('hAdk').textContent=h.adk_enabled?`ADK + ${h.model}`:'Offline rules (no GOOGLE_API_KEY)';$('hAdk').className='badge '+(h.adk_enabled?'ok':'warn');
 $('hMaps').textContent=h.google_routes?'Google Routes API':'Haversine ETA (no Maps key)';$('hMaps').className='badge '+(h.google_routes?'ok':'warn')});
refresh();setInterval(refresh,1500);
</script></body></html>
